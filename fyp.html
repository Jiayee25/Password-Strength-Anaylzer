<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Strength Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="card">
  <!-- Top: title + caption -->
  <div class="top">
    <h1>Password Strength Analyzer</h1>
    <p>Test your password strength securely</p>
  </div>

  <!-- Bottom: buttons left, icon right -->
  <div class="bottom">
    <div class="btn-row">
      <button class="btn btn-analyzer" id="btn-analyzer">Analyzer</button>
      <button class="btn btn-generator" id="btn-generator">Generator</button>
    </div>

    <div class="right">
      <div class="lock-ring">
        <svg width="42" height="42" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <div class="asterisks">
        <span>✱ ✱ ✱ ✱</span>
      </div>
    </div>
  </div>
</div>

<script src="fyp.js"></script>
</body>
</html>
